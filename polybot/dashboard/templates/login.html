<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POLYBOT — Login</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login-box{max-width:360px;margin:60px auto;padding:24px;border:1px solid #ccc;border-radius:8px;background:#fafafa}
  .login-box h2{margin-top:0;font-size:18px}
  input{width:100%;padding:8px;margin:8px 0;box-sizing:border-box}
  button{width:100%;padding:10px;background:#111;color:#fff;border:none;border-radius:4px;cursor:pointer}
  button:hover{background:#333}
  .warn{color:#a33;font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="login-box">
  <h2>POLYBOT</h2>
  <p style="font-size:12px;color:#666">Secure local dashboard (127.0.0.1). Authentication required.</p>
  <form method="post" action="/login">
    <label>Admin password</label>
    <input type="password" name="password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="warn">LIVE trading is locked by default. No real-money order is sent until you explicitly activate LIVE.</p>
</div>
</body>
</html>
